<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Trendora - Forgot Password</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    background: #faf9f6;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    color: #333;
  }

  body > div {
    width: 100%;
    max-width: 400px;
    background-color: #fff;
    padding: 40px 30px;
    border-radius: 8px;
    border: 1px solid #e0e3d7;
    box-shadow: 0 12px 30px rgba(22, 32, 51, 0.08);
    text-align: center;
  }

  h2 {
    margin-bottom: 30px;
    color: #303829;
    font-size: 28px;
    font-weight: 600;
  }

  input {
    width: 100%;
    padding: 12px 15px;
    margin: 12px 0;
    border: 1px solid #e0e3d7;
    border-radius: 8px;
    font-size: 16px;
    transition: all 0.3s ease;
  }

  input:focus {
    border-color: #65784b;
    box-shadow: 0 0 0 3px rgba(37, 117, 252, 0.12);
    outline: none;
  }

  button {
    width: 100%;
    padding: 12px;
    margin-top: 20px;
    background: #65784b;
    color: #fff;
    border: none;
    border-radius: 8px;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.3s ease;
  }

  button:hover {
    background: #303c24;
    transform: translateY(-2px);
    box-shadow: 0 8px 18px rgba(23, 63, 159, 0.18);
  }

  p {
    margin-top: 20px;
    font-size: 14px;
    color: #555;
  }

  p a {
    color: #65784b;
    text-decoration: none;
    font-weight: 600;
  }

  p a:hover { color: #37452a; }

  @media (max-width: 450px) { body > div { padding: 30px 20px; } }
</style>
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/storefront.css">
<script src="js/experience.js" defer></script>
</head>
<body class="store-page">

<div>
  <h2>Forgot Password</h2>
  <input type="text" id="emailOrPhone" placeholder="Enter your email or phone number">
  <button id="resetBtn">Send Reset Email</button>
  <p>Remembered your password? <a href="login.html">Login here</a></p>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getAuth, sendPasswordResetEmail } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
import { getFirestore, collection, query, where, getDocs } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyBFh6tNI6roZQecdYGtzs7tX75lY4NHbqo",
  authDomain: "trendora-1cd23.firebaseapp.com",
  projectId: "trendora-1cd23",
  storageBucket: "trendora-1cd23.firebasestorage.app",
  messagingSenderId: "1080352553475",
  appId: "1:1080352553475:web:850319561617a21fdfec36",
  measurementId: "G-LXQXX0YW38"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

document.getElementById("resetBtn").addEventListener("click", async () => {
  const input = document.getElementById("emailOrPhone").value.trim();

  if (!input) { alert("Please enter your email or phone number!"); return; }

  let emailToSend = input;

  // If input is phone (all digits, 10 chars), look up email in Firestore
  if (/^\d{10}$/.test(input)) {
    const usersRef = collection(db, "users");
    const q = query(usersRef, where("phone", "==", input));
    const querySnapshot = await getDocs(q);

    if (querySnapshot.empty) {
      alert("No account found with this phone number!");
      return;
    }

    emailToSend = querySnapshot.docs[0].data().email;
  }

  try {
    await sendPasswordResetEmail(auth, emailToSend, {
      url: 'https://trendora-1cd23.web.app/login.html',
      handleCodeInApp: true
    });
    alert(`Password reset link sent to ${emailToSend}. Check your inbox and spam folder.`);
  } catch (error) {
    alert("Error sending reset email: " + error.message);
  }
});
</script>

<script src="js/main.js" defer></script>
</body>
</html>
