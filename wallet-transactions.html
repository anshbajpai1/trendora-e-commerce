<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="description" content="View your Trendora Wallet balance and transaction history."><title>Wallet transactions — Trendora</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="css/storefront.css"><script src="js/main.js" defer></script><style>body{margin:0;background:#faf9f6;color:#35402d;font-family:'DM Sans',sans-serif}.wallet-page{width:min(860px,calc(100% - 36px));margin:55px auto 80px}.wallet-back{font-size:12px;color:#5d7045;text-decoration:none;font-weight:700}.wallet-head{margin:30px 0 24px;padding:34px 38px;background:#3d4931;color:#fff}.wallet-head p{margin:0 0 8px;color:#cbd6bd;font-size:10px;font-weight:700;letter-spacing:.16em}.wallet-head h1{margin:0;font:400 clamp(34px,5vw,53px)/1.05 Georgia,serif;letter-spacing:-.05em}.wallet-amount{margin:21px 0 0;color:#fff;font-size:36px;font-weight:800;letter-spacing:-.04em}.wallet-sub{color:#d7dfca;font-size:12px}.transaction-list{background:#fff;border:1px solid #e0e3d7}.transaction-list h2{margin:0;padding:20px 24px;border-bottom:1px solid #e5e8de;font-size:17px}.transaction{display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:center;padding:18px 24px;border-bottom:1px solid #edf0e8}.transaction:last-child{border:0}.transaction-icon{width:38px;height:38px;display:grid;place-items:center;border-radius:50%;font-size:18px}.transaction.credit .transaction-icon{background:#e5efd9;color:#486434}.transaction.debit .transaction-icon{background:#f5e9df;color:#96583c}.transaction strong,.transaction small{display:block}.transaction strong{font-size:13px}.transaction small{margin-top:3px;color:#808776;font-size:11px}.transaction-amount{text-align:right;font-size:14px;font-weight:800}.transaction.credit .transaction-amount{color:#477033}.transaction.debit .transaction-amount{color:#a1583a}.empty-wallet{padding:45px 24px;color:#7e8675;text-align:center;font-size:13px}.wallet-loading{padding:30px;color:#808776;font-size:13px}@media(max-width:600px){.wallet-page{margin:30px auto 50px}.wallet-head{padding:28px 24px}.transaction{padding:16px}.transaction-list h2{padding:18px 16px}}</style></head><body class="store-page"><main class="wallet-page"><a class="wallet-back" href="profile.html">← Back to profile</a><section class="wallet-head"><p>TRENDORA WALLET</p><h1>Your wallet activity.</h1><div class="wallet-amount" id="walletBalance">₹0.00</div><span class="wallet-sub">Available to use at checkout</span></section><section class="transaction-list"><h2>Wallet transactions</h2><div id="transactionList" class="wallet-loading">Loading your wallet activity…</div></section></main><script type="module">import{initializeApp}from'https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js';import{getAuth,onAuthStateChanged,setPersistence,browserLocalPersistence}from'https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js';import{getFirestore,doc,getDoc,collection,query,orderBy,onSnapshot}from'https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js';const app=initializeApp({apiKey:'AIzaSyBFh6tNI6roZQecdYGtzs7tX75lY4NHbqo',authDomain:'trendora-1cd23.firebaseapp.com',projectId:'trendora-1cd23',storageBucket:'trendora-1cd23.appspot.com',messagingSenderId:'1080352553475',appId:'1:1080352553475:web:850319561617a21fdfec36'}),auth=getAuth(app),db=getFirestore(app),money=new Intl.NumberFormat('en-IN',{style:'currency',currency:'INR'}),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));await setPersistence(auth,browserLocalPersistence);onAuthStateChanged(auth,async user=>{if(!user){location.href='login.html?returnUrl=wallet-transactions.html';return}const root=await getDoc(doc(db,'users',user.uid));document.getElementById('walletBalance').textContent=money.format(Math.max(0,Number(root.data()?.walletBalance||0)));onSnapshot(query(collection(db,'users',user.uid,'walletTransactions'),orderBy('createdAt','desc')),snap=>{const rows=snap.docs.map(d=>d.data());document.getElementById('transactionList').innerHTML=rows.length?rows.map(row=>{const credit=row.type==='credit',date=row.createdAt?.toDate?row.createdAt.toDate().toLocaleString('en-IN',{dateStyle:'medium',timeStyle:'short'}):'Processing date…';return`<article class="transaction ${credit?'credit':'debit'}"><span class="transaction-icon">${credit?'↙':'↗'}</span><div><strong>${esc(row.description||'Wallet transaction')}</strong><small>${esc(date)}${row.orderId?` · Order #${esc(row.orderId)}`:''}</small></div><div class="transaction-amount">${credit?'+':'−'}${money.format(Number(row.amount||0))}</div></article>`}).join(''):'<div class="empty-wallet">No wallet transactions yet.</div>'},()=>{document.getElementById('transactionList').innerHTML='<div class="empty-wallet">Wallet activity is unavailable right now.</div>'})});</script></body></html>
