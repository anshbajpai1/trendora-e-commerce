<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#262820"><title>Saved products · Trendora</title><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="css/home-components.css"><link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="css/storefront.css"><link rel="stylesheet" href="css/store-polish.css"><script src="js/main.js" defer></script><script src="js/experience.js" defer></script></head>
<body class="store-page wishlist-page"><main class="wishlist-shell"><header class="wishlist-header"><div><span class="eyebrow">YOUR TRENDORA</span><h1>Saved products.</h1><p id="wishlistIntro">Loading your shortlist…</p></div><a href="index.html#collection" class="continue-link">Continue shopping ↗</a></header><section id="wishlistProducts" class="wishlist-grid" aria-live="polite"><div class="wishlist-loading">Loading saved products…</div></section></main><div class="notification" id="wishlistToast" role="status" aria-live="polite"></div>
<script type="module">
import { normalizeCart, escapeHTML } from './js/commerce.mjs';
import { db } from './js/firebase-client.js';
import { doc, getDoc } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js';
const KEY='trendora-wishlist'; const host=document.getElementById('wishlistProducts'); const intro=document.getElementById('wishlistIntro'); const toast=document.getElementById('wishlistToast');
function ids(){try{const value=JSON.parse(localStorage.getItem(KEY)||'[]');return Array.isArray(value)?value.map(String):[]}catch{return[]}}
function save(next){localStorage.setItem(KEY,JSON.stringify([...new Set(next.map(String))]));}
function notice(text){toast.textContent=text;toast.classList.add('show');clearTimeout(notice.timer);notice.timer=setTimeout(()=>toast.classList.remove('show'),2200)}
function image(product){return Array.isArray(product.imageUrls)&&product.imageUrls[0]?product.imageUrls[0]:product.imageUrl||''}
function money(value){return new Intl.NumberFormat('en-IN',{style:'currency',currency:'INR'}).format(Number(value||0))}
async function render(){const saved=ids();if(!saved.length){intro.textContent='Your shortlist is ready when you are.';host.innerHTML='<div class="wishlist-empty"><h2>Nothing saved yet</h2><p>Browse the collection and tap the heart on any product to save it for later.</p><a href="index.html#collection" class="shop-btn">Explore products</a></div>';return;}intro.textContent=`${saved.length} saved item${saved.length===1?'':'s'} in your shortlist.`;host.innerHTML='<div class="wishlist-loading">Refreshing your saved products…</div>';const results=await Promise.all(saved.map(async id=>{try{const snap=await getDoc(doc(db,'products',id));return snap.exists()?{id:snap.id,...snap.data()}:null}catch{return null}}));const products=results.filter(Boolean);if(!products.length){save([]);return render();}host.innerHTML=products.map(product=>{const photo=image(product),stock=Number(product.quantity||0);return `<article class="wishlist-card"><a href="product-details.html?id=${encodeURIComponent(product.id)}" class="wishlist-photo">${photo?`<img src="${escapeHTML(photo)}" alt="${escapeHTML(product.name||'Product')}">`:'<span>Image unavailable</span>'}</a><div class="wishlist-copy"><p>${escapeHTML(product.category||'Trendora edit')}</p><h2><a href="product-details.html?id=${encodeURIComponent(product.id)}">${escapeHTML(product.name||'Untitled')}</a></h2><strong>${money(product.price)}</strong><span class="wishlist-stock ${stock>0?'':'out'}">${stock>0?'In stock':'Sold out'}</span><div><button class="wishlist-cart" data-cart="${escapeHTML(product.id)}" ${stock>0?'':'disabled'}>${stock>0?'Add to cart':'Unavailable'}</button><button class="wishlist-remove" data-remove="${escapeHTML(product.id)}">Remove</button></div></div></article>`}).join('');host.querySelectorAll('[data-remove]').forEach(button=>button.onclick=()=>{save(ids().filter(id=>id!==button.dataset.remove));notice('Removed from saved products.');render();});host.querySelectorAll('[data-cart]').forEach(button=>button.onclick=()=>{const product=products.find(item=>item.id===button.dataset.cart);let cart=normalizeCart(localStorage.getItem('cart')||'[]');const current=cart.find(item=>item.id===product.id);if(current){if(Number(current.quantity||1)>=Number(product.quantity||0)){notice(`Only ${product.quantity} available.`);return;}current.quantity+=1;}else{cart.push({id:product.id,name:product.name,price:Number(product.price||0),quantity:1,imageUrl:image(product),imageUrls:product.imageUrls||[]});}localStorage.setItem('cart',JSON.stringify(cart));window.TrendoraAuth?.refreshLayout?.();notice('Added to cart.');});}
render();
</script></body></html>
