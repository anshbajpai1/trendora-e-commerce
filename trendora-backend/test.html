<!DOCTYPE html>
<html>
<head>
  <title>Test Email</title>
</head>
<body>
  <h2>Send Test Order Email</h2>
  <form id="emailForm">
    <input type="text" id="name" placeholder="Name" value="Ansh Bajpai" required /><br><br>
    <input type="email" id="email" placeholder="Email" value="your_email@gmail.com" required /><br><br>
    <input type="text" id="order_id" placeholder="Order ID" value="ORD12345" required /><br><br>
    <textarea id="order_details" placeholder="Order Details">Product1 x2, Product2 x1</textarea><br><br>
    <input type="number" id="total" placeholder="Total Amount" value="1500" required /><br><br>
    <button type="submit">Send Email</button>
  </form>

  <script>
    const form = document.getElementById("emailForm");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();

      const orderData = {
        to: document.getElementById("email").value,
        type: "order-confirmation",
        payload: {
          order: {
            id: document.getElementById("order_id").value,
            customerName: document.getElementById("name").value,
            items: document.getElementById("order_details").value.split(",").map(name => ({
              name: name.trim(),
              quantity: 1,
              price: 0
            })),
            totalAmount: Number(document.getElementById("total").value || 0),
            paymentMethod: "COD",
            paymentStatus: "Pending",
            orderDateTime: new Date().toLocaleString("en-IN")
          }
        }
      };

      try {
        const response = await fetch("https://xgcuvjabxldaikdebztx.supabase.co/functions/v1/send-notification", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(orderData)
        });

        const result = await response.json();
        alert(result.message);
      } catch (err) {
        console.error(err);
        alert("Failed to send email");
      }
    });
  </script>
</body>
</html>
