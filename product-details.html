<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#111a2e">
<meta name="description" content="Trendora — product details, gallery and customer reviews.">
<title>Trendora — Product Details</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  /* ========== MONOCHROME DESIGN SYSTEM — single hue: slate-blue (222°) ========== */
  :root{
    --c-950:#0b1120;
    --c-900:#111a2e;
    --c-800:#1c2941;
    --c-700:#2b3b57;
    --c-600:#3d5175;
    --c-500:#556487;
    --c-400:#8391ab;
    --c-300:#b3bdd0;
    --c-200:#d6dce8;
    --c-100:#eaeef5;
    --c-50:#faf9f6;
    --c-0:#ffffff;
    --radius:16px;
    --radius-sm:10px;
    --shadow-sm:0 1px 2px rgba(11,17,32,0.06);
    --shadow:0 8px 24px rgba(11,17,32,0.08);
    --shadow-lg:0 20px 48px rgba(11,17,32,0.16);
    --ring:0 0 0 3px rgba(61,81,117,0.20);
    --maxw:1100px;
  }

  /* ---------- GLOBAL ---------- */
  *{margin:0;padding:0;box-sizing:border-box;}
  html{scroll-behavior:smooth;background:var(--c-50);}
  body{
    font-family:'Inter',system-ui,sans-serif;background:var(--c-50);color:var(--c-800);
    line-height:1.55;-webkit-font-smoothing:antialiased;min-height:100vh;padding-bottom:40px;
  }
  button{cursor:pointer;font-family:inherit;}
  a{color:inherit;text-decoration:none;}
  img{display:block;}
  ::selection{background:var(--c-700);color:var(--c-0);}

  @keyframes spin{to{transform:rotate(360deg);}}
  @keyframes fadeIn{from{opacity:0;}to{opacity:1;}}
  @keyframes popIn{from{opacity:0;transform:translateY(12px) scale(.97);}to{opacity:1;transform:translateY(0) scale(1);}}
  @keyframes shimmer{0%{background-position:-450px 0;}100%{background-position:450px 0;}}

  /* ---------- TOP BAR ---------- */
  .topbar{
    display:flex;justify-content:space-between;align-items:center;gap:16px;
    padding:14px clamp(16px,4vw,40px);background:rgba(255,255,255,0.85);
    backdrop-filter:saturate(180%) blur(12px);
    position:sticky;top:0;z-index:1000;border-bottom:1px solid var(--c-200);
  }
  .topbar .brand{
    font-weight:800;font-size:clamp(19px,3vw,24px);color:var(--c-900);
    letter-spacing:-0.02em;display:flex;align-items:center;gap:10px;
  }
  .topbar .brand::before{
    content:"";width:12px;height:12px;border-radius:4px;flex:none;
    background:var(--c-700);box-shadow:0 0 0 4px var(--c-200);
  }
  .topbar .backBtn{
    display:inline-flex;align-items:center;gap:7px;background:var(--c-0);color:var(--c-700);
    padding:9px 15px;border-radius:var(--radius-sm);font-weight:600;font-size:14px;
    border:1px solid var(--c-200);transition:.2s ease;box-shadow:var(--shadow-sm);margin:0;
  }
  .topbar .backBtn:hover{border-color:var(--c-600);color:var(--c-900);transform:translateY(-1px);box-shadow:var(--shadow);}
  .topbar .backBtn svg{width:16px;height:16px;}

  /* ---------- CONTAINER ---------- */
  .container{
    width:min(var(--maxw),calc(100% - 32px));margin:clamp(20px,4vw,36px) auto 0;
  }
  .product-card{
    background:var(--c-0);border:1px solid var(--c-200);border-radius:var(--radius);
    box-shadow:var(--shadow);overflow:hidden;
    display:grid;grid-template-columns:1.05fr 1fr;
  }
  @media(max-width:820px){.product-card{grid-template-columns:1fr;}}

  /* ---------- GALLERY ---------- */
  .gallery{padding:clamp(16px,3vw,24px);background:var(--c-50);border-right:1px solid var(--c-200);}
  @media(max-width:820px){.gallery{border-right:none;border-bottom:1px solid var(--c-200);}}
  .gallery-main{position:relative;}
  .gallery-main img{
    width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:var(--radius-sm);
    background:var(--c-100);cursor:zoom-in;border:1px solid var(--c-200);
  }
  .zoom-hint{
    position:absolute;bottom:12px;right:12px;display:inline-flex;align-items:center;gap:6px;
    background:rgba(11,17,32,0.72);color:var(--c-50);font-size:12px;font-weight:600;
    padding:6px 10px;border-radius:999px;pointer-events:none;backdrop-filter:blur(4px);
  }
  .zoom-hint svg{width:14px;height:14px;}
  .gallery-thumbs{
    display:grid;grid-template-columns:repeat(auto-fill,minmax(70px,1fr));gap:10px;margin-top:14px;
  }
  .gallery-thumbs button{
    padding:0;border:2px solid var(--c-200);background:var(--c-0);border-radius:var(--radius-sm);
    overflow:hidden;margin:0;transition:.2s ease;
  }
  .gallery-thumbs button:hover{border-color:var(--c-400);}
  .gallery-thumbs button.active{border-color:var(--c-700);box-shadow:var(--ring);}
  .gallery-thumbs img{width:100%;height:66px;object-fit:cover;display:block;margin:0;cursor:pointer;}

  /* ---------- PRODUCT INFO ---------- */
  .info{padding:clamp(20px,3.5vw,32px);display:flex;flex-direction:column;}
  .info .eyebrow{
    display:inline-flex;align-items:center;gap:7px;align-self:flex-start;
    font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--c-500);
    border:1px solid var(--c-200);background:var(--c-50);padding:5px 11px;border-radius:999px;margin-bottom:16px;
  }
  h1#productName{
    color:var(--c-900);font-size:clamp(24px,4vw,32px);font-weight:800;
    letter-spacing:-0.02em;line-height:1.15;margin-bottom:12px;text-wrap:balance;
  }
  .rating-summary{display:flex;align-items:center;gap:10px;margin-bottom:16px;min-height:22px;}
  .rating-summary .stars{display:inline-flex;gap:2px;color:var(--c-300);}
  .rating-summary .stars svg{width:18px;height:18px;}
  .rating-summary .stars svg.on{color:var(--c-700);}
  .rating-summary .rating-text{font-size:14px;color:var(--c-500);font-weight:600;}
  p#productDescription{color:var(--c-600);font-size:15px;line-height:1.7;margin-bottom:20px;}
  .price{
    font-size:clamp(24px,4vw,30px);color:var(--c-900);font-weight:800;letter-spacing:-0.02em;
    margin:0 0 22px;display:flex;align-items:baseline;gap:8px;
  }
  .price::before{content:"Price";font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--c-400);}

  .info-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:auto;}
  #addToCartBtn{
    flex:1 1 auto;min-width:180px;display:inline-flex;align-items:center;justify-content:center;gap:9px;
    background:var(--c-800);color:var(--c-0);border:1px solid var(--c-800);
    padding:14px 22px;border-radius:var(--radius-sm);font-weight:700;font-size:15px;transition:.2s ease;
    box-shadow:var(--shadow-sm);margin:0;
  }
  #addToCartBtn:hover:not(:disabled){background:var(--c-900);border-color:var(--c-900);transform:translateY(-2px);box-shadow:var(--shadow);}
  #addToCartBtn:disabled{background:var(--c-200);color:var(--c-500);border-color:var(--c-200);cursor:not-allowed;}
  #addToCartBtn svg{width:18px;height:18px;}
  #saveProductBtn{display:inline-flex;align-items:center;justify-content:center;min-width:136px;background:var(--c-0);color:var(--c-700);border:1px solid var(--c-300);padding:14px 18px;border-radius:var(--radius-sm);font-weight:700;font-size:14px;transition:.2s ease}
  #saveProductBtn:hover,#saveProductBtn.saved{border-color:var(--c-800);background:var(--c-800);color:var(--c-0)}

  /* ---------- REVIEWS ---------- */
  .reviews{
    width:min(var(--maxw),calc(100% - 32px));margin:clamp(20px,3vw,28px) auto 0;
    background:var(--c-0);border:1px solid var(--c-200);border-radius:var(--radius);
    box-shadow:var(--shadow);padding:clamp(20px,3.5vw,32px);
  }
  .reviews h2{
    color:var(--c-900);font-size:clamp(19px,3vw,23px);font-weight:800;letter-spacing:-0.02em;
    display:flex;align-items:center;gap:10px;margin-bottom:4px;
  }
  .reviews h2 svg{width:20px;height:20px;color:var(--c-600);}
  .reviews > h3{
    color:var(--c-800);font-size:16px;font-weight:700;margin:26px 0 4px;
    padding-top:22px;border-top:1px solid var(--c-200);
  }
  #reviewsList{display:flex;flex-direction:column;gap:0;margin-top:14px;}
  #reviewsList > p{color:var(--c-500);font-size:14px;padding:10px 0;}
  .review-card{
    border-top:1px solid var(--c-200);padding:16px 0;position:relative;
  }
  .review-card:first-child{border-top:none;padding-top:4px;}
  .review-head{display:flex;align-items:center;gap:12px;margin-bottom:8px;flex-wrap:wrap;}
  .review-avatar{
    width:38px;height:38px;flex:none;border-radius:50%;background:var(--c-100);color:var(--c-700);
    display:grid;place-items:center;font-weight:700;font-size:15px;border:1px solid var(--c-200);text-transform:uppercase;
  }
  .review-card b{display:block;color:var(--c-900);font-size:15px;font-weight:700;line-height:1.2;}
  .review-stars{display:inline-flex;gap:2px;color:var(--c-300);margin-top:3px;}
  .review-stars svg{width:15px;height:15px;}
  .review-stars svg.on{color:var(--c-700);}
  .comment-text{display:block;color:var(--c-600);font-size:14.5px;line-height:1.6;}

  /* review photo thumbnails */
  .review-photos{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px;}
  .review-photos .rev-photo{
    width:72px;height:72px;padding:0;margin:0;border:1px solid var(--c-200);border-radius:var(--radius-sm);
    overflow:hidden;background:var(--c-100);transition:.2s ease;
  }
  .review-photos .rev-photo:hover{border-color:var(--c-600);transform:translateY(-2px);box-shadow:var(--shadow-sm);}
  .review-photos .rev-photo img{width:100%;height:100%;object-fit:cover;cursor:zoom-in;}

  .review-actions{margin-top:12px;display:flex;gap:8px;}
  .review-actions button{
    display:inline-flex;align-items:center;gap:6px;background:var(--c-0);color:var(--c-700);
    border:1px solid var(--c-200);padding:7px 13px;border-radius:8px;font-weight:600;font-size:13px;
    transition:.2s ease;margin:0;
  }
  .review-actions button:hover{border-color:var(--c-600);color:var(--c-900);}
  .review-actions button.delete{color:var(--c-600);}
  .review-actions button.delete:hover{background:var(--c-900);color:var(--c-0);border-color:var(--c-900);}
  .review-actions button svg{width:14px;height:14px;}

  /* ---------- STAR INPUT WIDGET ---------- */
  .star-input{display:inline-flex;gap:4px;margin:4px 0 2px;}
  .star-input button{
    background:none;border:none;padding:2px;margin:0;line-height:0;color:var(--c-300);transition:.15s ease;
  }
  .star-input button svg{width:30px;height:30px;pointer-events:none;}
  .star-input button:hover{transform:scale(1.08);}
  .star-input button.on{color:var(--c-700);}
  .edit-form .star-input button svg{width:24px;height:24px;}
  .star-label{display:block;font-size:13px;font-weight:600;color:var(--c-600);margin:14px 0 2px;}

  /* ---------- FORMS ---------- */
  .review-form{margin-top:8px;max-width:560px;}
  .field-label{display:block;font-size:13px;font-weight:600;color:var(--c-600);margin:14px 0 6px;}
  .review-form input[type="text"],.review-form textarea,
  .edit-form input[type="text"],.edit-form textarea{
    width:100%;padding:12px 14px;border:1px solid var(--c-200);border-radius:var(--radius-sm);
    font-family:inherit;font-size:14.5px;color:var(--c-900);background:var(--c-50);transition:.2s ease;
  }
  .review-form input::placeholder,.review-form textarea::placeholder,
  .edit-form input::placeholder,.edit-form textarea::placeholder{color:var(--c-400);}
  .review-form input:focus,.review-form textarea:focus,
  .edit-form input:focus,.edit-form textarea:focus{outline:none;border-color:var(--c-600);box-shadow:var(--ring);background:var(--c-0);}
  .review-form input[readonly]{background:var(--c-100);color:var(--c-600);cursor:default;}
  .review-form textarea,.edit-form textarea{resize:vertical;min-height:90px;}

  /* photo upload */
  .upload-row{display:flex;align-items:center;gap:12px;flex-wrap:wrap;}
  .upload-btn{
    display:inline-flex;align-items:center;gap:8px;background:var(--c-0);color:var(--c-700);
    border:1px dashed var(--c-300);padding:11px 16px;border-radius:var(--radius-sm);
    font-weight:600;font-size:14px;transition:.2s ease;margin:0;
  }
  .upload-btn:hover:not(:disabled){border-color:var(--c-600);color:var(--c-900);background:var(--c-50);}
  .upload-btn:disabled{opacity:.5;cursor:not-allowed;}
  .upload-btn svg{width:16px;height:16px;}
  .upload-hint{font-size:12.5px;color:var(--c-400);}
  .photo-previews{display:flex;flex-wrap:wrap;gap:10px;margin-top:12px;}
  .photo-previews .thumb{
    position:relative;width:78px;height:78px;border-radius:var(--radius-sm);overflow:hidden;
    border:1px solid var(--c-200);background:var(--c-100);
  }
  .photo-previews .thumb img{width:100%;height:100%;object-fit:cover;}
  .photo-previews .thumb .remove{
    position:absolute;top:3px;right:3px;width:22px;height:22px;padding:0;margin:0;display:grid;place-items:center;
    background:rgba(11,17,32,0.72);color:var(--c-0);border:none;border-radius:50%;line-height:0;
  }
  .photo-previews .thumb .remove svg{width:12px;height:12px;}
  .photo-previews .thumb .remove:hover{background:var(--c-950);}
  .photo-previews .thumb.uploading .spin{
    position:absolute;top:50%;left:50%;width:22px;height:22px;margin:-11px 0 0 -11px;
    border:2px solid var(--c-300);border-top-color:var(--c-700);border-radius:50%;animation:spin .8s linear infinite;
  }

  .review-form button[type="submit"]{
    align-self:flex-start;width:auto;margin-top:20px;
    display:inline-flex;align-items:center;justify-content:center;gap:8px;
    background:var(--c-800);color:var(--c-0);border:1px solid var(--c-800);
    padding:12px 24px;border-radius:var(--radius-sm);font-weight:700;font-size:14.5px;transition:.2s ease;
    box-shadow:var(--shadow-sm);
  }
  .review-form button[type="submit"]:hover:not(:disabled){background:var(--c-900);border-color:var(--c-900);transform:translateY(-2px);box-shadow:var(--shadow);}
  .review-form button:disabled,.review-form input:disabled,.review-form textarea:disabled{opacity:.6;cursor:not-allowed;}
  .review-form button[type="submit"] svg{width:16px;height:16px;}

  .edit-form{margin-top:12px;display:flex;flex-direction:column;gap:2px;}
  .edit-form .edit-actions{display:flex;gap:10px;margin-top:12px;}
  .edit-form button{
    flex:1;display:inline-flex;align-items:center;justify-content:center;gap:7px;
    padding:11px 16px;border-radius:var(--radius-sm);font-weight:700;font-size:14px;border:1px solid;transition:.2s ease;margin:0;
  }
  .edit-form button svg{width:15px;height:15px;}
  .edit-form button[type="submit"]{background:var(--c-800);color:var(--c-0);border-color:var(--c-800);}
  .edit-form button[type="submit"]:hover{background:var(--c-900);border-color:var(--c-900);}
  .edit-form button.delete{background:var(--c-0);color:var(--c-700);border-color:var(--c-200);}
  .edit-form button.delete:hover{border-color:var(--c-600);color:var(--c-900);}
  .edit-form button:disabled{opacity:.6;cursor:not-allowed;}

  /* inline button spinner */
  .btn-spin{width:16px;height:16px;border:2px solid rgba(255,255,255,0.4);border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite;flex:none;}

  /* visually-hidden native rating input (kept for functionality) */
  .visually-hidden{position:absolute!important;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0;}

  /* ---------- LIGHTBOX (image modal + arrows) ---------- */
  .modal{
    display:none;position:fixed;z-index:2000;inset:0;background:rgba(11,17,32,0.90);
    justify-content:center;align-items:center;padding:24px;backdrop-filter:blur(4px);animation:fadeIn .2s ease;
  }
  .modal img{max-width:88%;max-height:84%;border-radius:var(--radius);box-shadow:var(--shadow-lg);animation:popIn .25s ease;}
  .modal span#closeModal{
    position:absolute;top:18px;right:24px;width:44px;height:44px;display:grid;place-items:center;
    font-size:30px;line-height:1;color:var(--c-50);cursor:pointer;border-radius:50%;
    background:rgba(255,255,255,0.10);border:1px solid rgba(255,255,255,0.25);transition:.2s ease;z-index:2;
  }
  .modal span#closeModal:hover{background:rgba(255,255,255,0.20);}
  .lb-nav{
    position:absolute;top:50%;transform:translateY(-50%);width:52px;height:52px;display:grid;place-items:center;
    background:rgba(255,255,255,0.10);border:1px solid rgba(255,255,255,0.25);border-radius:50%;
    color:var(--c-50);transition:.2s ease;z-index:2;
  }
  .lb-nav:hover{background:rgba(255,255,255,0.22);}
  .lb-nav svg{width:24px;height:24px;}
  .lb-prev{left:20px;}
  .lb-next{right:20px;}
  .lb-counter{
    position:absolute;bottom:22px;left:50%;transform:translateX(-50%);
    color:var(--c-50);font-size:14px;font-weight:600;background:rgba(255,255,255,0.10);
    border:1px solid rgba(255,255,255,0.25);padding:6px 14px;border-radius:999px;backdrop-filter:blur(4px);
  }
  @media(max-width:560px){.lb-nav{width:42px;height:42px;}.lb-prev{left:8px;}.lb-next{right:8px;}}

  /* ---------- STATE MESSAGES ---------- */
  .state-msg{
    width:min(var(--maxw),calc(100% - 32px));margin:40px auto;background:var(--c-0);
    border:1px solid var(--c-200);border-radius:var(--radius);padding:48px 24px;text-align:center;
    color:var(--c-600);font-size:16px;box-shadow:var(--shadow);
  }

  /* ---------- FULL-PAGE LOADER ---------- */
  .page-loader{
    position:fixed;inset:0;z-index:3000;background:var(--c-50);
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;
    transition:opacity .4s ease,visibility .4s ease;
  }
  .page-loader.hide{opacity:0;visibility:hidden;pointer-events:none;}
  .page-loader .ring{
    width:52px;height:52px;border:4px solid var(--c-200);border-top-color:var(--c-700);
    border-radius:50%;animation:spin .9s linear infinite;
  }
  .page-loader .loader-brand{font-weight:800;font-size:20px;color:var(--c-900);letter-spacing:-0.02em;}
  .page-loader .loader-text{font-size:13.5px;color:var(--c-500);}

  /* ---------- APP DIALOG (replaces alert/confirm) ---------- */
  .dialog-overlay{
    display:none;position:fixed;inset:0;z-index:4000;background:rgba(11,17,32,0.55);
    align-items:center;justify-content:center;padding:24px;backdrop-filter:blur(3px);
  }
  .dialog-overlay.open{display:flex;animation:fadeIn .18s ease;}
  .dialog{
    width:min(400px,100%);background:var(--c-0);border:1px solid var(--c-200);border-radius:var(--radius);
    box-shadow:var(--shadow-lg);padding:26px 24px 22px;text-align:center;animation:popIn .22s ease;
  }
  .dialog-icon{
    width:54px;height:54px;border-radius:50%;display:grid;place-items:center;margin:0 auto 14px;
    background:var(--c-100);color:var(--c-700);
  }
  .dialog-icon svg{width:26px;height:26px;}
  .dialog-icon.success{background:rgba(43,59,87,0.10);color:var(--c-700);}
  .dialog-icon.error{background:rgba(17,26,46,0.10);color:var(--c-900);}
  .dialog-icon.info{background:var(--c-100);color:var(--c-600);}
  .dialog-msg{color:var(--c-800);font-size:15.5px;font-weight:500;line-height:1.55;margin-bottom:20px;}
  .dialog-actions{display:flex;gap:10px;justify-content:center;}
  .dialog-actions button{
    min-width:100px;padding:11px 18px;border-radius:var(--radius-sm);font-weight:700;font-size:14px;
    border:1px solid;transition:.2s ease;margin:0;
  }
  .dialog-actions button.solid{background:var(--c-800);color:var(--c-0);border-color:var(--c-800);}
  .dialog-actions button.solid:hover{background:var(--c-900);border-color:var(--c-900);}
  .dialog-actions button.ghost{background:var(--c-0);color:var(--c-700);border-color:var(--c-200);}
  .dialog-actions button.ghost:hover{border-color:var(--c-600);color:var(--c-900);}
</style>
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/storefront.css">
<script src="js/experience.js" defer></script>
</head>
<body class="store-page">

<!-- FULL PAGE LOADER -->
<div class="page-loader" id="pageLoader">
  <div class="ring" aria-hidden="true"></div>
  <div class="loader-brand">Trendora</div>
  <div class="loader-text">Loading product details…</div>
</div>

<header class="topbar">
  <a href="index.html" class="brand">Trendora</a>
  <button class="backBtn" onclick="window.history.back()">

/* ================= IMAGE COMPRESSION ================= */
function compressImage(file, maxDim = 800, quality = 0.6){
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = e => {
      const img = new Image();
      img.onload = () => {
        let width = img.width, height = img.height;
        if (width > height){ if (width > maxDim){ height = Math.round(height * maxDim / width); width = maxDim; } }
        else { if (height > maxDim){ width = Math.round(width * maxDim / height); height = maxDim; } }
        const canvas = document.createElement("canvas");
        canvas.width = width; canvas.height = height;
        canvas.getContext("2d").drawImage(img, 0, 0, width, height);
        resolve(canvas.toDataURL("image/jpeg", quality));
      };
      img.onerror = reject;
      img.src = e.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

/* ================= REVIEW PHOTO UPLOAD (new review form) ================= */
const reviewPhotosInput = document.getElementById("reviewPhotos");

reviewPhotosInput.onchange = async () => {
  const files = Array.from(reviewPhotosInput.files || []);
  reviewPhotosInput.value = "";
  if (!files.length) return;
  const room = MAX_PHOTOS - selectedReviewImages.length;
  if (room <= 0){ showMessage(`You can add up to ${MAX_PHOTOS} photos.`, "info"); return; }
  const toAdd = files.slice(0, room);
  for (const file of toAdd){
    if (!file.type.startsWith("image/")) continue;
    // placeholder tile with spinner while compressing
    const tile = document.createElement("div");
    tile.className = "thumb uploading";
    tile.innerHTML = `<span class="spin" aria-hidden="true"></span>`;
    photoPreviews.appendChild(tile);
    try {
      const dataUrl = await compressImage(file);
      selectedReviewImages.push(dataUrl);
      tile.remove();
      renderPhotoPreviews();
    } catch (err){ console.error(err); tile.remove(); }
  }
  if (files.length > room) showMessage(`Only ${MAX_PHOTOS} photos allowed — extra images were skipped.`, "info");
};

function renderPhotoPreviews(){
  photoPreviews.querySelectorAll(".thumb:not(.uploading)").forEach(n => n.remove());

/* ---------- STAR HELPERS (UI only) ---------- */
const STAR_PATH = "M12 2l2.9 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l7.1-1.01z";
function starsMarkup(rating, cls = "review-stars") {
  const r = Math.round(Number(rating) || 0);
  let out = `<span class="${cls}" aria-label="${r} out of 5 stars">`;
  for (let i = 1; i <= 5; i++) {
    out += `<svg class="${i <= r ? "on" : ""}" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="${STAR_PATH}"/></svg>`;
  }
  return out + "</span>";
}
// Build an interactive star selector that writes into a hidden number input
function buildStarSelector(container, hiddenInput, initial = 0) {
  let value = Number(initial) || 0;
  const paint = v => container.querySelectorAll("button").forEach((b, i) => b.classList.toggle("on", i < v));
  container.innerHTML = "";
  for (let i = 1; i <= 5; i++) {
    const btn = document.createElement("button");
    btn.type = "button";
    btn.setAttribute("role", "radio");
    btn.setAttribute("aria-label", `${i} star${i > 1 ? "s" : ""}`);
    btn.innerHTML = `<svg viewBox="0 0 24 24" fill="currentColor"><path d="${STAR_PATH}"/></svg>`;
    btn.addEventListener("click", () => { value = i; hiddenInput.value = i; paint(i); btn.setAttribute("aria-checked", "true"); });
    btn.addEventListener("mouseenter", () => paint(i));
    container.addEventListener("mouseleave", () => paint(value));
    container.appendChild(btn);
  }
  hiddenInput.value = value || "";
  paint(value);
  return { reset: () => { value = 0; hiddenInput.value = ""; paint(0); } };
}

const starInputEl = document.getElementById("starInput");

function getProductImages(data) {
  if (Array.isArray(data.imageUrls) && data.imageUrls.length) return data.imageUrls.filter(Boolean);
  return data.imageUrl ? [data.imageUrl] : [];
}

let currentGalleryIndex = 0;
function renderProductGallery(images) {
  const mainImage = document.getElementById("productImage");
  const thumbs = document.getElementById("productThumbs");
  productImages = images.filter(Boolean);
  if (!productImages.length) {
    mainImage.hidden = true;
    thumbs.innerHTML = '';
    if (!mainImage.parentElement.querySelector('.image-unavailable')) mainImage.insertAdjacentHTML('afterend', '<span class="image-unavailable">Image unavailable</span>');
    document.querySelector('.zoom-hint').hidden = true;
    return;
  }
  mainImage.hidden = false;
  currentGalleryIndex = 0;
  mainImage.src = productImages[0];
  thumbs.innerHTML = productImages.map((url, index) => `
    <button type="button" class="${index === 0 ? "active" : ""}" data-image="${url}" data-index="${index}" aria-label="View product image ${index + 1}">
      <img src="${url}" alt="Product thumbnail ${index + 1}">
    </button>
  `).join("");
  thumbs.querySelectorAll("button").forEach(btn => {
    btn.onclick = () => {
      mainImage.src = btn.dataset.image;
      currentGalleryIndex = Number(btn.dataset.index) || 0;
      thumbs.querySelectorAll("button").forEach(item => item.classList.remove("active"));
      btn.classList.add("active");
    };
  });
}

onAuthStateChanged(auth, async user => {
  if (!user) {

    el.disabled = false;
  });

    const profileRef = doc(db, "users", user.uid, "profile", "info");

});

function hidePageLoader(){ pageLoader.classList.add("hide"); document.querySelector(".product-card")?.classList.remove("detail-loading"); document.querySelector(".product-card")?.setAttribute("aria-busy", "false"); }

async function loadProductDetails() {
  if (!productId) { document.querySelector(".container").innerHTML = "<p class='state-msg'>No product ID found!</p>"; hidePageLoader(); return; }

  try {
    const docRef = doc(db, "products", productId);
    const docSnap = await getDoc(docRef);
    if (!docSnap.exists()) { document.querySelector(".container").innerHTML = "<p class='state-msg'>Product not found!</p>"; hidePageLoader(); return; }

    const data = docSnap.data();
    rememberProduct();
    document.getElementById("productName").innerText = data.name;
    document.getElementById("productDescription").innerText = data.description || "No description available.";
    document.getElementById("productPrice").innerText = `${data.price} ₹`;
    renderProductGallery(getProductImages(data));
    const stock = Number(data.quantity || 0);
    const addToCartBtn = document.getElementById("addToCartBtn");
    addToCartBtn.disabled = stock <= 0;
    addToCartBtn.innerHTML = stock <= 0
      ? `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><line x1="4.93" y1="4.93" x2="19.07" y2="19.07"/></svg> Out of Stock`
      : `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg> Add to Cart`;

    addToCartBtn.onclick = () => {
      if (!currentUserUid && !window.TrendoraAuth?.currentUser) {
        window.TrendoraAuth?.openAuthModal({ mode: "login", returnUrl: `product-details.html?id=${productId || ""}` });
        return;
      }
      if (stock <= 0) {
        showMessage("This product is out of stock.", "error");
        return;
      }
      let cart = normalizeCart(localStorage.getItem("cart") || "[]");
      const existing = cart.find(i => i.id === productId);
      if (existing) {
        if (Number(existing.quantity || 1) >= stock) {
          showMessage(`Only ${stock} item${stock === 1 ? "" : "s"} available.`, "info");
          return;
        }
        existing.quantity += 1;
      }
      else cart.push({ id: productId, name: data.name, price: data.price, quantity: 1, imageUrl: productImages[0], imageUrls: productImages });
      localStorage.setItem("cart", JSON.stringify(cart));
      window.TrendoraAuth?.refreshLayout();
      showMessage("Product added to cart!", "success");
    };
    setupSavedProduct(data);

    loadReviews();
  } catch (error) { console.error(error); document.querySelector(".container").innerHTML = "<p class='state-msg'>Failed to load product details.</p>"; }
  finally { hidePageLoader(); }
}

function updateRatingSummary(ratings) {
  const el = document.getElementById("ratingSummary");
  if (!el) return;
  if (!ratings.length) {
    el.innerHTML = `${starsMarkup(0, "stars")}<span class="rating-text">No ratings yet</span>`;
    return;
  }
  const avg = ratings.reduce((a, b) => a + b, 0) / ratings.length;
  el.innerHTML = `${starsMarkup(avg, "stars")}<span class="rating-text">${avg.toFixed(1)} · ${ratings.length} review${ratings.length === 1 ? "" : "s"}</span>`;
}

function reviewPhotosMarkup(images){
  if (!Array.isArray(images) || !images.length) return "";
  return `<div class="review-photos">` + images.map((url, i) =>
    `<button type="button" class="rev-photo" data-review-photo="${i}" aria-label="View review photo ${i + 1}"><img src="${url}" alt="Review photo ${i + 1}"></button>`
  ).join("") + `</div>`;
}

function loadReviews() {
  const reviewsRef = collection(db, "products", productId, "reviews");
  const q = query(reviewsRef, orderBy("timestamp","asc"));

  onSnapshot(q, snap => {
    reviewsList.innerHTML = "";
    if (snap.empty) { reviewsList.innerHTML = "<p>No reviews yet. Be the first to share your thoughts.</p>"; updateRatingSummary([]); return; }

    const ratings = [];
    snap.forEach(docSnap => {
      const data = docSnap.data();
      ratings.push(Number(data.rating) || 0);
      const initial = (data.name || "?").trim().charAt(0) || "?";
      const images = Array.isArray(data.images) ? data.images : [];
      const div = document.createElement("div");
      div.className = "review-card";
      div.innerHTML = `
        <div class="review-head">
          <span class="review-avatar" aria-hidden="true">${initial}</span>
          <span>
            <b>${data.name}</b>
            ${starsMarkup(data.rating, "review-stars")}
          </span>
        </div>
        <span class="comment-text">${data.comment}</span>
        ${reviewPhotosMarkup(images)}`;

      // review photo lightbox
      if (images.length){
        div.querySelectorAll("[data-review-photo]").forEach(btn => {
          btn.onclick = () => openLightbox(images, Number(btn.dataset.reviewPhoto) || 0);
        });
      }

      if(data.uid === currentUserUid){
        const actions = document.createElement("div");
        actions.className = "review-actions";

        const editBtn = document.createElement("button");
        editBtn.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.12 2.12 0 0 1 3 3L12 15l-4 1 1-4z"/></svg> Edit`;
        editBtn.onclick = () => inlineEditReview(docSnap.id, data, div);

        const deleteBtn = document.createElement("button");
        deleteBtn.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg> Delete`;
        deleteBtn.className = "delete";
        deleteBtn.onclick = () => deleteReview(docSnap.id);

        actions.appendChild(editBtn);
        actions.appendChild(deleteBtn);
        div.appendChild(actions);
      }

      reviewsList.appendChild(div);
    });
    updateRatingSummary(ratings);
  });
}

reviewForm.onsubmit = async e => {
  e.preventDefault();
  if (!currentUserUid) {
    window.TrendoraAuth?.openAuthModal({ mode: "login", returnUrl: `product-details.html?id=${productId || ""}` });
    return;
  }
  if (!productId) return;
  if (!reviewRating.value) { showMessage("Please select a star rating.", "error"); return; }
  setBtnLoading(submitReviewBtn, true, "Submitting…");
  try {
    await addDoc(collection(db, "products", productId, "reviews"), {
      name: profileName,
      uid: currentUserUid,
      rating: parseInt(reviewRating.value),
      comment: reviewComment.value,
      images: selectedReviewImages.slice(),
      timestamp: new Date()
    });
    reviewForm.reset();
    reviewName.value = profileName;
    starSelector.reset();
    selectedReviewImages = [];
    renderPhotoPreviews();
    uploadHint.textContent = `Up to ${MAX_PHOTOS} images`;
    setBtnLoading(submitReviewBtn, false);
    showMessage("Review submitted!", "success");
  } catch (err) { console.error(err); setBtnLoading(submitReviewBtn, false); showMessage("Failed to submit review.", "error"); }
};

function inlineEditReview(reviewId, data, div) {
  const existingImages = Array.isArray(data.images) ? data.images.slice() : [];
  div.innerHTML = `
    <div class="review-head">
      <span class="review-avatar" aria-hidden="true">${(data.name || "?").trim().charAt(0) || "?"}</span>
      <span><b>${data.name}</b></span>
    </div>
    <form class="edit-form">
      <span class="star-label">Rating</span>
      <div class="star-input" data-edit-stars></div>
      <input type="number" name="rating" class="visually-hidden" value="${data.rating}" min="1" max="5" required tabindex="-1">
      <label class="field-label">Comment</label>
      <textarea name="comment" rows="3" required>${data.comment}</textarea>
      <label class="field-label">Photos</label>
      <div class="photo-previews" data-edit-previews></div>
      <div class="edit-actions">
        <button type="submit"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="20 6 9 17 4 12"/></svg> Save</button>
        <button type="button" class="delete"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg> Cancel</button>
      </div>
    </form>
  `;
  const form = div.querySelector(".edit-form");
  buildStarSelector(form.querySelector("[data-edit-stars]"), form.rating, data.rating);

  const editPreviews = form.querySelector("[data-edit-previews]");
  function renderEditPreviews(){
    editPreviews.innerHTML = "";
    if (!existingImages.length){ editPreviews.innerHTML = `<span class="upload-hint">No photos</span>`; return; }
    existingImages.forEach((url, i) => {
      const tile = document.createElement("div");
      tile.className = "thumb";
      tile.innerHTML = `<img src="${url}" alt="Review photo ${i + 1}">
        <button type="button" class="remove" aria-label="Remove photo">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>`;
      tile.querySelector(".remove").onclick = () => { existingImages.splice(i, 1); renderEditPreviews(); };
      tile.querySelector("img").onclick = () => openLightbox(existingImages, i);
      editPreviews.appendChild(tile);
    });
  }
  renderEditPreviews();

  const saveBtn = form.querySelector('button[type="submit"]');
  form.onsubmit = async e => {
    e.preventDefault();
    const newRating = parseInt(form.rating.value);
    const newComment = form.comment.value;
    if (!newRating || !newComment) return;
    setBtnLoading(saveBtn, true, "Saving…");
    try {
      const reviewRef = doc(db, "products", productId, "reviews", reviewId);
      await updateDoc(reviewRef, { rating: newRating, comment: newComment, images: existingImages });
      setBtnLoading(saveBtn, false);
      showMessage("Review updated!", "success");
    } catch (err) { console.error(err); setBtnLoading(saveBtn, false); showMessage("Failed to update review.", "error"); }
  };
  form.querySelector(".delete").onclick = () => loadReviews();
}

async function deleteReview(reviewId) {
  const ok = await showConfirm("Are you sure you want to delete this review?");
  if (!ok) return;
  try {
    const reviewRef = doc(db, "products", productId, "reviews", reviewId);
    await deleteDoc(reviewRef);
    showMessage("Review deleted!", "success");
  } catch (err) { console.error(err); showMessage("Failed to delete review.", "error"); }
}

/* ================= LIGHTBOX (image modal with arrows) ================= */
const modal = document.getElementById("imgModal");
const modalImg = document.getElementById("modalImg");
const closeModal = document.getElementById("closeModal");
const lbPrev = document.getElementById("lbPrev");
const lbNext = document.getElementById("lbNext");
const lbCounter = document.getElementById("lbCounter");

let lbImages = [];
let lbIndex = 0;

function renderLightbox(){
  if (!lbImages.length) return;
  modalImg.src = lbImages[lbIndex];
  const many = lbImages.length > 1;
  lbPrev.style.display = many ? "grid" : "none";
  lbNext.style.display = many ? "grid" : "none";
  lbCounter.style.display = many ? "block" : "none";
  lbCounter.textContent = `${lbIndex + 1} / ${lbImages.length}`;
}
function openLightbox(images, index = 0){
  lbImages = (images && images.length) ? images : [modalImg.src];
  lbIndex = Math.max(0, Math.min(index, lbImages.length - 1));
  renderLightbox();
  modal.style.display = "flex";
}
function lightboxStep(dir){
  if (lbImages.length < 2) return;
  lbIndex = (lbIndex + dir + lbImages.length) % lbImages.length;
  renderLightbox();
}
function closeLightbox(){ modal.style.display = "none"; }

// Product main image -> open gallery lightbox at current index
document.getElementById("productImage").onclick = () => openLightbox(productImages, currentGalleryIndex);

lbPrev.onclick = e => { e.stopPropagation(); lightboxStep(-1); };
lbNext.onclick = e => { e.stopPropagation(); lightboxStep(1); };
closeModal.onclick = closeLightbox;
modal.onclick = e => { if (e.target === modal) closeLightbox(); };

document.addEventListener("keydown", e => {
  if (modal.style.display !== "flex") return;
  if (e.key === "ArrowLeft") lightboxStep(-1);
  else if (e.key === "ArrowRight") lightboxStep(1);
  else if (e.key === "Escape") closeLightbox();
});
</script>
